[project]
name = "drone-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "gymnasium", "stable-baselines3", "tensorboard", "rerun-sdk", "pandas", "matplotlib"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
